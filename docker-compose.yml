# Environnement de DÉVELOPPEMENT uniquement. Les valeurs par défaut ne servent
# qu'en local : ne jamais les réutiliser ailleurs. Copier .env.example en .env
# pour les changer. Fixer les versions d'images avant une vraie mise en production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalements}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-change-me}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - storage-data:/data

  # Crée le bucket "photos" au démarrage puis s'arrête
  storage-init:
    image: minio/mc:latest
    depends_on:
      - storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-change-me}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://storage:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/photos;
      exit 0;
      "

volumes:
  db-data:
  storage-data:
