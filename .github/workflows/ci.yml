name: CI

on:
  pull_request:
  push:
    branches: [main]

# Annule l'exécution précédente si on repousse sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Droits minimum : lecture du code uniquement
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 25 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Compile, lance les tests unitaires et d'intégration (Testcontainers),
      # et les tests d'architecture (Spring Modulith / ArchUnit)
      - name: Build et tests
        run: mvn -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      # Adapter la commande de test à la configuration du projet généré
      - run: npm test -- --watch=false
      - run: npm run build

